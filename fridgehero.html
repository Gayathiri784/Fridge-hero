<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fridge Hero 🍳</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial;background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.box{max-width:500px;width:100%;padding:30px;background:white;border-radius:22px;box-shadow:0 20px 50px #0004}
h1{text-align:center;margin:0;color:#1f2937}
.sub{text-align:center;color:#6b7280;margin:8px 0 25px}
input{width:100%;padding:13px;margin:6px 0;border:2px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;color:white;font-size:17px;font-weight:bold;background:linear-gradient(135deg,#8b5cf6,#ec4899);cursor:pointer}
button:disabled{opacity:.6}
#loading,#error{display:none;text-align:center;margin-top:15px}
#error{color:#dc2626}
#result{display:none;margin-top:25px;padding:20px;background:#fef3c7;border-radius:15px}
h2{text-align:center;margin:0 0 8px;color:#1f2937}
.info{text-align:center;color:#555;margin-bottom:15px}
li{margin:10px 0;padding:11px;background:#fff9;border-radius:8px;line-height:1.45}
.final{margin-top:15px;padding:12px;background:white;border-radius:10px;text-align:center;font-weight:bold;color:#1f2937}
</style>
</head>

<body>
<div class="box">

<h1>Fridge Hero 🍳</h1>
<div class="sub">Turn your ingredients into a recipe</div>

<input id="i1" placeholder="Ingredient 1 e.g. Chicken">
<input id="i2" placeholder="Ingredient 2 e.g. Lemon">
<input id="i3" placeholder="Ingredient 3 e.g. Garlic">

<button id="btn" onclick="cook()">Cook Magic ✨</button>

<div id="loading">👨‍🍳 Chef is cooking...</div>
<div id="error"></div>

<div id="result">
  <h2 id="name"></h2>
  <div class="info" id="info"></div>
  <ol id="steps"></ol>
  <div class="final" id="final"></div>
</div>

</div>

<script>
const KEY="AQ.Ab********************************";
const URL=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${KEY}`;

async function cook(){

  const a=i1.value.trim(),b=i2.value.trim(),c=i3.value.trim();

  if(!a||!b||!c){
    showError("Please enter all 3 ingredients.");
    return;
  }

  btn.disabled=true;
  loading.style.display="block";
  result.style.display="none";
  errorDiv.style.display="none";

  try{

    const prompt=`
You are a professional chef teaching a beginner.

Ingredients: ${a}, ${b}, ${c}

Create ONE simple recipe.

Return exactly:
1. A short recipe name.
2. Number of servings.
3. Total cooking time.
4. Exactly 3 short cooking steps.
5. A final line clearly saying what dish was made.

Rules:
- Use simple English.
- Give exact amounts like 250g, 1 tbsp, 1/2 tsp.
- Include cooking time when needed.
- Include heat level when useful.
- Explain what to do clearly.
- Each step should be under 25 words.
- The final line must say: "Final dish: [dish name]"
`;

    const r=await fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        contents:[{parts:[{text:prompt}]}],
        generationConfig:{
          responseMimeType:"application/json",
          responseSchema:{
            type:"OBJECT",
            properties:{
              dishName:{type:"STRING"},
              servings:{type:"STRING"},
              time:{type:"STRING"},
              steps:{type:"ARRAY",items:{type:"STRING"}},
              finalDish:{type:"STRING"}
            },
            required:["dishName","servings","time","steps","finalDish"]
          }
        }
      })
    });

    if(!r.ok) throw new Error("API error: "+r.status);

    const d=await r.json();
    const text=d?.candidates?.[0]?.content?.parts?.[0]?.text;

    if(!text) throw new Error("No recipe received.");

    const recipe=JSON.parse(text);

    if(!recipe.dishName||recipe.steps?.length!==3)
      throw new Error("Invalid recipe received.");

    name.textContent=recipe.dishName;

    info.textContent=
      `🍽️ ${recipe.servings}  •  ⏱️ ${recipe.time}`;

    steps.innerHTML=recipe.steps
      .map(x=>`<li>${x}</li>`).join("");

    final.textContent=
      recipe.finalDish || `Final dish: ${recipe.dishName}`;

    result.style.display="block";

  }catch(e){
    showError(e.message);
  }

  btn.disabled=false;
  loading.style.display="none";
}

const errorDiv=document.getElementById("error");

function showError(msg){
  errorDiv.textContent=msg;
  errorDiv.style.display="block";
}
</script>

</body>
</html>
